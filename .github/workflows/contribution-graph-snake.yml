name: Contribution Graph Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate classic green contribution graph with small snake
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: 111984prasannagp
          animation_mode: snake
          food_count: "3"
          palette: auto
          output_path: dist/contribution-graph-snake.svg

      - name: Publish contribution graph
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
